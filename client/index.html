<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riko AI - 3D Desktop Companion</title>

  <!-- Google Fonts for Anime Speech Subtitles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.min.js"
      }
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    /* 3D WebGL Viewport */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #canvas-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Discreet Model Switcher (Top-Right) */
    .model-toggle {
      position: absolute;
      top: 18px;
      right: 22px;
      display: flex;
      gap: 3px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(229, 231, 235, 0.8);
      padding: 3px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      z-index: 10;
    }

    .model-chip {
      border: none;
      background: transparent;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .model-chip:hover {
      color: #111827;
    }

    .model-chip.active {
      background: #111827;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    }

    /* Subtle Loading Chip (Top-Left) */
    .loading-chip {
      position: absolute;
      top: 18px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(229, 231, 235, 0.8);
      font-size: 12px;
      font-weight: 500;
      color: #4b5563;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .loading-chip-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(236, 72, 153, 0.25);
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Speech Subtitle Overlay (Image 3 Style: Real-Time Animated Floating Subtitles) */
    #speech-subtitle {
      position: absolute;
      bottom: 104px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 760px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.4s ease;
      font-family: 'Fredoka', 'Nunito', 'Segoe UI', system-ui, sans-serif;
      font-size: 23px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.4px;
      line-height: 1.45;
      -webkit-text-stroke: 1.2px #261f28;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.9), 0 0 18px rgba(244, 114, 182, 0.6);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .sub-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(5px) scale(0.92);
      transition: opacity 0.12s cubic-bezier(0, 0, 0.2, 1), transform 0.12s cubic-bezier(0, 0, 0.2, 1);
    }

    .sub-word.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .thinking-dots {
      opacity: 0.75;
      font-size: 20px;
      letter-spacing: 0.8px;
      animation: thinkingPulse 1.2s infinite ease-in-out;
    }

    @keyframes thinkingPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.02); }
    }

    /* Single Sleek Floating Capsule Input Bar (Image 2 Style) */
    .floating-capsule {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 22px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 999px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.07), 0 2px 8px rgba(0, 0, 0, 0.03);
      z-index: 10;
      transition: all 0.25s ease;
    }

    .floating-capsule:focus-within {
      background: rgba(255, 255, 255, 0.95);
      border-color: rgba(236, 72, 153, 0.5);
      box-shadow: 0 16px 42px rgba(236, 72, 153, 0.14), 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    .capsule-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14.5px;
      color: #1f2937;
      padding-right: 10px;
    }

    .capsule-input::placeholder {
      color: #9ca3af;
      font-weight: 400;
    }

    .mic-action-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .mic-action-btn:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #111827;
    }

    .mic-action-btn.recording {
      background: #ef4444;
      color: #ffffff;
      animation: micPulse 1.2s infinite ease-in-out;
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); box-shadow: 0 0 16px rgba(239, 68, 68, 0.55); }
    }
  </style>
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Subtle Loading Indicator -->
  <div id="loading-chip" class="loading-chip">
    <div class="loading-chip-spinner"></div>
    <span id="loading-chip-text">Loading Riko...</span>
  </div>

  <!-- Discreet Model Switcher Pill -->
  <div class="model-toggle">
    <button id="btn-riko" class="model-chip active" data-model="riko">Riko</button>
    <button id="btn-furina" class="model-chip" data-model="furina">Furina</button>
  </div>

  <!-- Real-Time Anime Speech Subtitles -->
  <div id="speech-subtitle" style="opacity: 0;"></div>

  <!-- Sleek Floating Capsule Input Bar -->
  <div class="floating-capsule">
    <input type="text" id="chat-input" class="capsule-input" placeholder="Type a message..." autocomplete="off" />
    <button id="mic-btn" class="mic-action-btn" title="Voice Input">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
  </div>

  <script type="module" src="app.js?v=11"></script>
</body>
</html>
