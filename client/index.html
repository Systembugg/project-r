<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riko AI - 3D Desktop Companion</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.4/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>
<body>
  <!-- 3D WebGL Canvas -->
  <div id="canvas-container"></div>

  <!-- Floating Minimal Header -->
  <header class="top-header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-title">RIKO AI</span>
    </div>
    <div class="header-controls">
      <div class="model-pill">
        <button id="btn-riko" class="model-btn active" data-model="riko">Riko</button>
        <button id="btn-furina" class="model-btn" data-model="furina">Furina</button>
      </div>
    </div>
  </header>

  <!-- Floating Subtitle / Dialogue Card -->
  <div id="dialogue-card" class="dialogue-card">
    <div id="user-query" class="user-query" style="display: none;"></div>
    <div class="speaker-header">
      <span id="speaker-name" class="speaker-name">Riko</span>
      <span id="status-badge" class="status-badge">Ready</span>
    </div>
    <p id="dialogue-text" class="speaker-text">Hey there! I'm your desktop companion. Ask me anything or tap the mic to speak!</p>
  </div>

  <!-- Floating Input Pill -->
  <div id="floating-input-bar" class="floating-input-bar">
    <button id="mic-btn" class="icon-btn mic-btn" title="Voice Input (Mic)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <input type="text" id="chat-input" class="chat-input" placeholder="Say something..." autocomplete="off" />
    <button id="send-btn" class="icon-btn send-btn" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <span id="loading-text">Loading 3D Companion...</span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
